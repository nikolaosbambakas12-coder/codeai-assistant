<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeAI — Coding Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#23273a;--surface3:#2d3148;
  --border:#2e3250;--text:#e8eaf6;--muted:#7880a0;--accent:#7c6fcd;
  --accent2:#5c50b0;--green:#4caf7d;--red:#e05c5c;--code:#23273a;
  --radius:10px;--font:system-ui,-apple-system,sans-serif;--mono:'Fira Code','Courier New',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* AUTH SCREEN */
#auth-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem;width:360px;max-width:95vw}
.auth-logo{text-align:center;margin-bottom:1.5rem}
.auth-logo .icon{font-size:2.5rem;display:block;margin-bottom:.5rem}
.auth-logo h1{font-size:1.4rem;font-weight:600;color:var(--text)}
.auth-logo p{font-size:.85rem;color:var(--muted);margin-top:.3rem}
.auth-tabs{display:flex;gap:0;margin-bottom:1.5rem;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.auth-tab{flex:1;padding:.6rem;text-align:center;font-size:.85rem;cursor:pointer;background:transparent;color:var(--muted);border:none;transition:.2s}
.auth-tab.active{background:var(--accent);color:#fff;font-weight:500}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.4rem;font-weight:500}
.field input{width:100%;padding:.65rem .85rem;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.9rem;outline:none;transition:.2s}
.field input:focus{border-color:var(--accent)}
.auth-btn{width:100%;padding:.75rem;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:.95rem;font-weight:600;cursor:pointer;transition:.2s;margin-top:.5rem}
.auth-btn:hover{background:var(--accent2)}
.auth-error{font-size:.8rem;color:var(--red);text-align:center;margin-top:.75rem;min-height:1.2em}

/* MAIN APP */
#app{display:none;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:1rem;padding:.75rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-logo{font-size:1rem;font-weight:700;color:var(--accent);letter-spacing:.5px}
.topbar-spacer{flex:1}
.user-badge{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--muted)}
.user-badge .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff}
.logout-btn{padding:.35rem .7rem;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:.75rem;cursor:pointer;transition:.2s}
.logout-btn:hover{border-color:var(--red);color:var(--red)}

/* MAIN LAYOUT */
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:.85rem 1rem;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.new-chat-btn{padding:.3rem .5rem;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:.75rem;cursor:pointer;transition:.2s}
.new-chat-btn:hover{background:var(--accent2)}
.chat-list{flex:1;overflow-y:auto;padding:.5rem}
.chat-item{padding:.6rem .75rem;border-radius:8px;cursor:pointer;font-size:.82rem;color:var(--muted);transition:.15s;display:flex;align-items:center;gap:.5rem;position:relative}
.chat-item:hover{background:var(--surface2);color:var(--text)}
.chat-item.active{background:var(--surface3);color:var(--text)}
.chat-item .chat-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .del-btn{opacity:0;padding:.2rem;cursor:pointer;color:var(--muted);font-size:.85rem;border:none;background:none;border-radius:4px;transition:.15s;flex-shrink:0}
.chat-item:hover .del-btn{opacity:1}
.chat-item .del-btn:hover{color:var(--red)}
.chat-icon{font-size:.85rem;flex-shrink:0}

/* CHAT AREA */
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:1.25rem 1rem;display:flex;flex-direction:column;gap:1rem}
.msg{display:flex;gap:.75rem;max-width:100%}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.msg.user .msg-avatar{background:var(--accent);color:#fff}
.msg.assistant .msg-avatar{background:var(--green);color:#fff}
.msg-bubble{max-width:75%;padding:.75rem 1rem;border-radius:12px;font-size:.88rem;line-height:1.65}
.msg.user .msg-bubble{background:var(--accent2);color:#fff;border-bottom-right-radius:3px}
.msg.assistant .msg-bubble{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:3px}
.msg-bubble pre{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:.85rem;margin:.6rem 0;overflow-x:auto;font-family:var(--mono);font-size:.82rem;line-height:1.55}
.msg-bubble code{font-family:var(--mono);font-size:.83rem;background:var(--surface3);padding:.15em .35em;border-radius:4px}
.msg-bubble pre code{background:none;padding:0}

.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;color:var(--muted);text-align:center;padding:2rem}
.empty-state .big-icon{font-size:3rem;opacity:.4}
.empty-state h2{font-size:1.1rem;font-weight:500;color:var(--text);opacity:.6}
.empty-state p{font-size:.85rem;max-width:280px}
.suggestions{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:.5rem}
.suggestion-chip{padding:.4rem .85rem;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:.8rem;color:var(--muted);cursor:pointer;transition:.2s}
.suggestion-chip:hover{border-color:var(--accent);color:var(--accent)}

/* INPUT */
.input-area{padding:.85rem 1rem;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.input-row{display:flex;gap:.6rem;align-items:flex-end}
.input-wrap{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;transition:.2s}
.input-wrap:focus-within{border-color:var(--accent)}
#user-input{background:transparent;border:none;outline:none;color:var(--text);font-size:.9rem;padding:.75rem 1rem;resize:none;font-family:var(--font);max-height:150px;overflow-y:auto;min-height:44px;line-height:1.5}
.send-btn{padding:.7rem 1.1rem;background:var(--accent);color:#fff;border:none;border-radius:12px;cursor:pointer;font-size:1.1rem;transition:.2s;flex-shrink:0}
.send-btn:hover{background:var(--accent2)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.typing-dot{display:inline-flex;gap:3px;align-items:center}
.typing-dot span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:bounce .8s infinite}
.typing-dot span:nth-child(2){animation-delay:.15s}
.typing-dot span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="icon">💻</span>
      <h1>CodeAI</h1>
      <p>Your personal coding assistant</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign in</button>
      <button class="auth-tab" onclick="switchTab('register')">Register</button>
    </div>
    <div id="login-form">
      <div class="field"><label>Username</label><input type="text" id="login-user" placeholder="your username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="login-pass" placeholder="your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth('login')"></div>
      <button class="auth-btn" onclick="doAuth('login')">Sign in</button>
    </div>
    <div id="register-form" style="display:none">
      <div class="field"><label>Username</label><input type="text" id="reg-user" placeholder="choose a username" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="reg-pass" placeholder="choose a password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doAuth('register')"></div>
      <button class="auth-btn" onclick="doAuth('register')">Create account</button>
    </div>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- KEY MODAL -->
<div id="key-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center">
  <div style="background:#1a1d27;border:1px solid #2e3250;border-radius:16px;padding:2rem;width:360px;max-width:95vw">
    <h2 style="font-size:1.1rem;font-weight:600;margin-bottom:1rem;color:#e8eaf6">Gemini API Key</h2>
    <p style="font-size:.82rem;color:#7880a0;margin-bottom:1rem">Your key is saved locally in the browser only.</p>
    <input type="password" id="key-input" placeholder="AQ.Ab8..." style="width:100%;padding:.65rem .85rem;background:#23273a;border:1px solid #2e3250;border-radius:10px;color:#e8eaf6;font-size:.88rem;outline:none;margin-bottom:1rem">
    <div style="display:flex;gap:.75rem">
      <button onclick="saveKey()" style="flex:1;padding:.65rem;background:#7c6fcd;color:#fff;border:none;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer">Save</button>
      <button onclick="document.getElementById('key-modal').style.display='none'" style="flex:1;padding:.65rem;background:transparent;color:#7880a0;border:1px solid #2e3250;border-radius:10px;font-size:.9rem;cursor:pointer">Cancel</button>
    </div>
  </div>
</div>

<!-- KEY MODAL -->
<div id="key-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center">
  <div style="background:#1a1d27;border:1px solid #2e3250;border-radius:16px;padding:2rem;width:360px;max-width:95vw">
    <h2 style="font-size:1.1rem;font-weight:600;margin-bottom:1rem;color:#e8eaf6">Gemini API Key</h2>
    <p style="font-size:.82rem;color:#7880a0;margin-bottom:1rem">Saved locally in your browser only.</p>
    <input type="password" id="key-input" placeholder="Your Gemini API key..." style="width:100%;padding:.65rem .85rem;background:#23273a;border:1px solid #2e3250;border-radius:10px;color:#e8eaf6;font-size:.88rem;outline:none;margin-bottom:1rem">
    <div style="display:flex;gap:.75rem">
      <button onclick="saveKey()" style="flex:1;padding:.65rem;background:#7c6fcd;color:#fff;border:none;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer">Save</button>
      <button onclick="document.getElementById('key-modal').style.display='none'" style="flex:1;padding:.65rem;background:transparent;color:#7880a0;border:1px solid #2e3250;border-radius:10px;font-size:.9rem;cursor:pointer">Cancel</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">💻 CodeAI</div>
    <div class="topbar-spacer"></div>
    <div class="user-badge">
      <div class="avatar" id="user-avatar">N</div>
      <span id="user-display"></span>
    </div>
    <button class="logout-btn" onclick="showKeySettings()" id="key-btn" title="API Key">⚙ Key</button>
    <button class="logout-btn" onclick="showKeySettings()">⚙ Key</button>
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">
        Chats
        <button class="new-chat-btn" onclick="newChat()">+ New</button>
      </div>
      <div class="chat-list" id="chat-list"></div>
    </div>
    <div class="chat-area">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <div class="input-row">
          <div class="input-wrap">
            <textarea id="user-input" rows="1" placeholder="Ask about code, debug an error, or request an example..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          </div>
          <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let db = null;
let user = null;
let currentUser = null;
let chats = {};
let activeChat = null;
let isTyping = false;

const SYSTEM_PROMPT = `You are CodeAI, an expert coding assistant. You help with:
- Writing, reviewing, and debugging code in any language
- Explaining programming concepts clearly
- Suggesting best practices and optimizations
- Helping with algorithms, data structures, and system design
- Roblox Lua / Luau scripting and game development

Format code in proper markdown code blocks with language tags.
Be concise but thorough. If you're unsure, say so.`;

function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (tab==='login')===!i));
  document.getElementById('login-form').style.display = tab==='login' ? '' : 'none';
  document.getElementById('register-form').style.display = tab==='register' ? '' : 'none';
  document.getElementById('auth-error').textContent = '';
}

async function doAuth(type) {
  const err = document.getElementById('auth-error');
  err.textContent = '';
  const username = document.getElementById(type==='login'?'login-user':'reg-user').value.trim();
  const password = document.getElementById(type==='login'?'login-pass':'reg-pass').value;
  if (!username || !password) { err.textContent = 'Fill in all fields.'; return; }
  if (username.length < 3) { err.textContent = 'Username must be at least 3 characters.'; return; }
  if (password.length < 4) { err.textContent = 'Password must be at least 4 characters.'; return; }

  const usersKey = 'codeai_users';
  let users = {};
  try { users = JSON.parse(localStorage.getItem(usersKey)||'{}'); } catch(e){}

  if (type === 'register') {
    if (users[username]) { err.textContent = 'Username already taken.'; return; }
    users[username] = { password: btoa(password), created: Date.now() };
    localStorage.setItem(usersKey, JSON.stringify(users));
  } else {
    if (!users[username] || users[username].password !== btoa(password)) {
      err.textContent = 'Wrong username or password.'; return;
    }
  }

  currentUser = username;
  localStorage.setItem('codeai_session', username);
  await initApp();
}

function logout() {
  localStorage.removeItem('codeai_session');
  currentUser = null; chats = {}; activeChat = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

async function initApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('user-display').textContent = currentUser;
  document.getElementById('user-avatar').textContent = currentUser[0].toUpperCase();

  const saved = localStorage.getItem('codeai_chats_'+currentUser);
  try { chats = JSON.parse(saved||'{}'); } catch(e){ chats = {}; }

  renderSidebar();
  const ids = Object.keys(chats);
  if (ids.length > 0) {
    const latest = ids.sort((a,b) => (chats[b].updated||0)-(chats[a].updated||0))[0];
    loadChat(latest);
  } else {
    showEmpty();
  }
}

function saveChats() {
  localStorage.setItem('codeai_chats_'+currentUser, JSON.stringify(chats));
}

function newChat() {
  const id = 'chat_'+Date.now();
  chats[id] = { id, title: 'New chat', messages: [], created: Date.now(), updated: Date.now() };
  saveChats();
  renderSidebar();
  loadChat(id);
}

function loadChat(id) {
  activeChat = id;
  document.querySelectorAll('.chat-item').forEach(el => el.classList.toggle('active', el.dataset.id===id));
  renderMessages();
}

function deleteChat(id, e) {
  e.stopPropagation();
  delete chats[id];
  saveChats();
  if (activeChat === id) { activeChat = null; showEmpty(); }
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('chat-list');
  const sorted = Object.values(chats).sort((a,b) => (b.updated||0)-(a.updated||0));
  list.innerHTML = sorted.length ? sorted.map(c => `
    <div class="chat-item${activeChat===c.id?' active':''}" data-id="${c.id}" onclick="loadChat('${c.id}')">
      <span class="chat-icon">💬</span>
      <span class="chat-title">${escHtml(c.title)}</span>
      <button class="del-btn" onclick="deleteChat('${c.id}',event)" title="Delete">✕</button>
    </div>`).join('') : '<div style="padding:.75rem;font-size:.8rem;color:var(--muted);text-align:center">No chats yet</div>';
}

function showEmpty() {
  document.getElementById('messages').innerHTML = `
    <div class="empty-state">
      <div class="big-icon">💻</div>
      <h2>CodeAI — Coding Assistant</h2>
      <p>Ask anything about code. Debug errors, write functions, learn concepts.</p>
      <div class="suggestions">
        <div class="suggestion-chip" onclick="quickSend('How do I reverse a string in Python?')">Reverse string in Python</div>
        <div class="suggestion-chip" onclick="quickSend('Explain async/await in JavaScript')">Async/await explained</div>
        <div class="suggestion-chip" onclick="quickSend('Write a Luau script for a Roblox door')">Roblox door script</div>
        <div class="suggestion-chip" onclick="quickSend('What is Big O notation?')">Big O notation</div>
      </div>
    </div>`;
}

function quickSend(text) {
  if (!activeChat) newChat();
  document.getElementById('user-input').value = text;
  sendMessage();
}

function renderMessages() {
  if (!activeChat || !chats[activeChat]) { showEmpty(); return; }
  const msgs = chats[activeChat].messages;
  if (msgs.length === 0) { showEmpty(); return; }
  const container = document.getElementById('messages');
  container.innerHTML = msgs.map(m => renderMsg(m)).join('');
  container.scrollTop = container.scrollHeight;
}

function renderMsg(m) {
  const isUser = m.role === 'user';
  const initials = isUser ? currentUser[0].toUpperCase() : 'AI';
  return `<div class="msg ${m.role}">
    <div class="msg-avatar">${initials}</div>
    <div class="msg-bubble">${formatMsg(m.content)}</div>
  </div>`;
}

function formatMsg(text) {
  text = escHtml(text);
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_,lang,code) =>
    `<pre><code>${code.trimEnd()}</code></pre>`);
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  text = text.replace(/\n/g, '<br>');
  return text;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function handleKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150)+'px';
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text || isTyping) return;
  if (!activeChat) newChat();

  input.value = ''; input.style.height=''; isTyping = true;
  document.getElementById('send-btn').disabled = true;

  const chat = chats[activeChat];
  chat.messages.push({ role: 'user', content: text });
  if (chat.title === 'New chat') chat.title = text.slice(0, 40)+(text.length>40?'…':'');
  chat.updated = Date.now();
  saveChats();
  renderMessages();
  renderSidebar();

  const container = document.getElementById('messages');
  const typingEl = document.createElement('div');
  typingEl.className = 'msg assistant';
  typingEl.innerHTML = `<div class="msg-avatar">AI</div><div class="msg-bubble"><div class="typing-dot"><span></span><span></span><span></span></div></div>`;
  container.appendChild(typingEl);
  container.scrollTop = container.scrollHeight;

  try {
    const GEMINI_KEY = localStorage.getItem('codeai_gemini_key') || '';
    const history = chat.messages.slice(0,-1).map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    }));
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: [...history, { role: 'user', parts: [{ text: text }] }],
        generationConfig: { maxOutputTokens: 1500 }
      })
    });
    const data = await response.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry, something went wrong.';
    chat.messages.push({ role: 'assistant', content: reply });
    chat.updated = Date.now();
    saveChats();
  } catch(e) {
    chat.messages.push({ role: 'assistant', content: 'Connection error. Please try again.' });
    saveChats();
  }

  typingEl.remove();
  isTyping = false;
  document.getElementById('send-btn').disabled = false;
  renderMessages();
  renderSidebar();
}

function showKeySettings(){
  document.getElementById('key-input').value = localStorage.getItem('codeai_gemini_key')||'';
  document.getElementById('key-modal').style.display='flex';
}
function saveKey(){
  const k=document.getElementById('key-input').value.trim();
  if(k) localStorage.setItem('codeai_gemini_key',k);
  document.getElementById('key-modal').style.display='none';
}
window.addEventListener('load', () => {
  const session = localStorage.getItem('codeai_session');
  if (session) { currentUser = session; initApp(); }
});
</script>
</body>
</html>
